services:
  provider:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build llama.cpp for these CUDA architectures (RTX 20xx..50xx + data-center).
        # e.g. use "60;70" for older GPUs.
        CUDA_ARCHITECTURES: "75;80;86;89;90"
    image: chia-llm-provider:latest
    container_name: chia-llm-provider
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      memlock: -1
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Pool mode (optional): set BOTH vars to auto-join a pool at startup.
      # The agent will hash MODEL_GGUF, verify SHA256 matches the pool, then
      # POST /api/pools/join. Progress is streamed to docker compose logs.
      # Leave commented to run in solo mode.
      # - POOL_NUMBER=10001
      # - MODEL_GGUF=/app/models/qwen3.gguf
    volumes:
      - ./config.json:/app/config.json:ro
      - ./models:/app/models:ro
    # No inbound ports — the agent opens an outbound WS to platformUrl.
    # Uncomment to expose llama-server locally (debug):
    # ports:
    #   - "127.0.0.1:8080:8080"
