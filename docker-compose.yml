services:
  provider:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build llama.cpp pour ces architectures CUDA (RTX 20xx..50xx + data-center).
        # Remplace par ex "60;70" pour des cartes plus anciennes.
        CUDA_ARCHITECTURES: "75;80;86;89;90"
    image: chia-llm-provider:latest
    container_name: chia-llm-provider
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      memlock: -1
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./config.json:/app/config.json:ro
      - ./models:/app/models:ro
    # Pas de ports entrants — l'agent fait une connexion WS sortante vers platformUrl.
    # Decommenter pour exposer llama-server localement (debug) :
    # ports:
    #   - "127.0.0.1:8080:8080"
